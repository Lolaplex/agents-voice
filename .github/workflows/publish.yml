name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build source and binary distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Notify Release Published
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::RELEASE_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; tag=os.environ.get('GITHUB_REF_NAME', ''); repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; repo_url=f'{server}/{repo}'; release_url=f'{server}/{repo}/releases/tag/{tag}'; print(json.dumps({'embeds':[{'title':f'🚀 Release {tag} Published! — {repo}','url':release_url,'description':f'**{repo}** release is live on GitHub Releases.\\n[View release]({release_url}) · [Repository]({repo_url})','color':3447003}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL"

      - name: Notify Release Failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::CI_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; tag=os.environ.get('GITHUB_REF_NAME', ''); repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; repo_url=f'{server}/{repo}'; run_url=f'{server}/{repo}/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}'; print(json.dumps({'embeds':[{'title':f'🚨 Release Failed: {repo}','url':run_url,'description':f'Failed to create release \`{tag}\` on GitHub.\\n[View run]({run_url}) · [Repository]({repo_url})','color':15158332}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL"
