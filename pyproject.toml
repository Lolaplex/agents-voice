[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-voice"
version = "0.0.1"
description = "Fast, minimal speech output MCP server and CLI for AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
]
keywords = ["mcp", "agents", "voice", "tts", "azure", "coding-assistant", "cursor", "antigravity"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/agents-voice"
Repository = "https://github.com/Lolaplex/agents-voice"
"Bug Tracker" = "https://github.com/Lolaplex/agents-voice/issues"

[project.scripts]
agents-voice = "agents_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
